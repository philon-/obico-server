version: "2.4"
services:
  ml_api:
    hostname: ml_api
    restart: unless-stopped
    pull_policy: build
    env_file: ml_api_standalone.env
    tty: true
    command: bash -c "gunicorn --bind ${ML_API_HOST-0.0.0.0}:${ML_API_PORT-3333}
      --timeout 600 --workers 1 wsgi"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider --no-check-certificate
          http://ml_api:${ML_API_PORT-3333}/hc/
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - YOUR_INPUT_PATH:${ML_INPUT_IMAGE}
      - YOUR_OUTPUT_PATH:${ML_OUTPUT_IMAGE}
    ports:
      - 3333:${ML_API_PORT-3333}
